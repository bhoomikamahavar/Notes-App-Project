<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="d-flex">
        <aside class="sidebar p-3">
            <h4>Notes</h4>
            <p class="small text-muted mb-1">Add New</p>
            <button class="btn btn-primary w-100 mb-3" data-bs-toggle="modal" data-bs-target="#noteModal"><i class="bi bi-plus-circle me-2"></i> Add New</button>
        </aside>
        <main class="content p-4 flex-grow-1">
            <h2 class="mb-4">My Notes</h2>
            <section class="mb-5">
                <div id="notesList" class="row"></div>
            </section>
        </main>
    </div>
    <!-- modal -->
    <div class="modal" tabindex="-1" id="noteModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Note</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" name="noteTitle" id="noteTitle" class="form-control mb-3"
                        placeholder="Note Title" />
                    <textarea name="noteText" id="noteText" rows="3" placeholder="Write something..."
                        class="form-control mb-3"></textarea>
                    <input type="date" id="noteDate" class="form-control mb-3" />
                    <input type="time" id="noteTime" class="form-control mb-3" />
                    <select id="noteSelect" class="form-select mb-3">
                        <option value="">Select</option>
                        <option value="first">First</option>
                        <option value="second">Seconds</option>
                        <option value="third">Third</option>
                    </select>
                    <input type="file" id="noteFile" class="form-control mb-3" accept="image/*" />
                    <input type="hidden" id="editIndex" />
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveNote">Save</button>
                </div>
            </div>
        </div>
    </div>
    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- custom script -->
    <script src="/app.js"></script>
</body>

</html>
